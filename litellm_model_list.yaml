# LiteLLM / OpenAI 兼容 harness 模型清单模板
# 把 base_url + api_key 补全后，harness 即可调用这些免费模型
model_list:
  # cognitivecomputations/dolphin-mistral-24b-venice-edition:free  -> 免费档说明: https://openrouter.ai/cognitivecomputations/dolphin-mistral-24b-venice-edition:free
  - model_name: cognitivecomputations/dolphin-mistral-24b-venice-edition:free
    litellm_params:
      model: openai/<该提供方上的模型名>
      api_base: <填该提供方的 OpenAI 兼容 base_url>
      api_key: os.environ/COGNITIVECOMPUTATIONS/DOLPHIN-MISTRAL-24B-VENICE-EDITION:FREE_KEY

